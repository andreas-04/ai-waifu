<!-- templates/home.html -->
{% extends "base.html" %}

{% block title %}Home | Focus Fairy{% endblock %}

{% block content %}

  <!-- The content of the page -->
    <div class="container-fluid mt-4">
      <div class="row">

        <!-- Left side -->
        <div class="col-md-6">
          <div class="screen-half">
            <h1>Status</h1>

            <!-- Total system on / off -->
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="systemToggle">
              <label class="form-check-label" for="systemToggle">System Enabled</label>
            </div>
            <br>

            <!-- Camera Access Switch -->
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="cameraToggle">
              <label class="form-check-label" for="cameraToggle">Camera Access</label>
            </div>
            <br>

            <!-- Screen Access Switch -->
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="screenToggle">
              <label class="form-check-label" for="screenToggle">Screen Access</label>
            </div>
            <br>

            <!-- Logs -->
            <label class="form-check-label" for="logging-box">Logs</label>
            <textarea id="logging-box" class="logging-box" rows="9" disabled></textarea>
          </div>
        </div>

        <!-- Right side -->
        <div class="col-md-6">
          <div class="screen-half">
            <h1>Profile</h1>
            <form>
              <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" placeholder="John Smith">
              </div>
              <br>

              <div class="form-group">
                <label for="job_title">Job Title</label>
                <input type="text" class="form-control" id="job_title" placeholder="Software Engineer">
              </div>
              <br>

              <div class="form-group">
                <label for="project_desc">Project Description</label>
                <input type="text" class="form-control" id="project_desc" placeholder="Develop Github 2">
              </div>
              <br>

              <div class="form-group">
                <div class="col-md-6">
                  <button type="button" class="btn btn-primary">Save</button>
                  <button type="button" class="btn btn-danger">Reset</button>
                </div>
                <div class="col-md-6">
                  
                </div>
              </div>
              <br>

            </form>
          </div>
        </div>
      </div>
    </div>

{% endblock %}
