<!-- templates/home.html -->
{% extends "base.html" %}

{% block title %}Home | Focus Fairy{% endblock %}

{% block content %}

<script src="{{ url_for('static', filename='pureknob.js') }}"></script>
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>

<div class="container-fluid mt-4">
  <div class="row">

    <!-- LEFT HALF -->
    <div class="col-md-6">
      <div class="row">

        <!-- Top Left -->
        <div class="col-12 mb-3">
          <div class="screen-half">
            <h1>Productivity</h1>
            <div id="prod_dial" class="centered"></div>
          </div>
        </div>

        <!-- Bottom Left -->
        <div class="col-12">
          <div class="screen-half">
            <h1>Hydration</h1>
            <div id="hydration_dial" class="centered"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- RIGHT HALF -->
    <div class="col-md-6">
      <div class="row">

        <!-- Top Right -->
        <div class="col-12 mb-3">
          <div class="screen-half">
            <h1>Focus</h1>
            <div id="focus_dial" class="centered"></div>
          </div>
        </div>

        <!-- Bottom Right -->
        <div class="col-12">
          <div class="screen-half">
            <h1>Posture</h1>
            <div id="posture_dial" class="centered"></div>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

{% endblock %}
