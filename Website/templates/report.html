<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Focus Fairy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light custom-navbar">
      <div class="container-fluid">
        <img class="navbar-brand" href="#" src="../images/icon.png" alt="Icon" height="50px">

        <button class="navbar-toggler" type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="#">Home</a>
          <a class="nav-link active" href="#">Report</a>
        </div>
      </div>
    </nav>

  <!-- The content of the page -->
    <div class="container-fluid mt-4">
      <div class="row">

        <!-- Left side -->
        <div class="col-md-6">
          <div class="screen-half">
            <h1>Statistics</h1>

            <!-- Average Focus -->
            <div class="form-check form-switch">
                <label for="avg_focus">Average Focus</label>
                <input type="number" class="form-control" id="avg_focus" placeholder="Average Focus">
            </div>
            <br>

            <!-- Average Focus -->
            <div class="form-check form-switch">
                <label for="avg_posture">Average Posture</label>
                <input type="number" class="form-control" id="avg_posture" placeholder="Average Posture">
            </div>
            <br>

            <!-- Logs -->
            <label class="form-check-label" for="logging-box">Logs</label>
            <textarea id="logging-box" class="logging-box" rows="9" disabled></textarea>
          </div>
        </div>

        <!-- Right side -->
        <div class="col-md-6">
          <div class="screen-half">
            <h1>Work Score</h1>
            <form>
              <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" placeholder="John Smith">
              </div>
              <br>

              <div class="form-group">
                <label for="job_title">Job Title</label>
                <input type="text" class="form-control" id="job_title" placeholder="Software Engineer">
              </div>
              <br>

              <div class="form-group">
                <label for="project_desc">Project Description</label>
                <input type="text" class="form-control" id="project_desc" placeholder="Develop Github 2">
              </div>
              <br>

              <div class="form-group">
                <div class="col-md-6">
                  <button type="button" class="btn btn-primary">Save</button>
                  <button type="button" class="btn btn-danger">Reset</button>
                </div>
                <div class="col-md-6">
                  
                </div>
              </div>
              <br>

            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="index.js"></script>
  </body>
</html>
